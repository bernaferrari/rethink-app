build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    comments: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  # Size rules ratchet: baseline absorbs existing debt; new violations fail the build.
  LongMethod:
    active: true
    threshold: 120
  LargeClass:
    active: true
    threshold: 600
  LongParameterList:
    functionThreshold: 20
    constructorThreshold: 25

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateMember:
    # @Preview functions are tooling entry points; "unused" is their purpose.
    ignoreAnnotated:
      - 'Preview'

naming:
  FunctionNaming:
    # Composables are PascalCase by Compose convention; not a naming defect.
    ignoreAnnotated:
      - 'Composable'

exceptions:
  SwallowedException:
    active: true
  PrintStackTrace:
    active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Error
      - Exception
      - Throwable
      - RuntimeException
      - NullPointerException
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - Error
      - Exception
      - Throwable
      - RuntimeException

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  CastNullableToNonNullableType:
    active: true
